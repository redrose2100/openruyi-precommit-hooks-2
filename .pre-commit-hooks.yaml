- id: check-spec-header
  name: check-spec-header
  description: Ensure spec files start with the required SPDX copyright and license header.
  entry: check-spec-header
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-basic-fields
  name: check-spec-basic-fields
  description: Ensure spec files follow the basic fields and sections rules from the openRuyi packaging guidelines.
  entry: check-spec-basic-fields
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-name
  name: check-spec-name
  description: Ensure the spec Name field follows the naming rules from the openRuyi packaging guidelines. A capitalized name is checked against the case its Source URLs use; use --no-check-upstream-case to skip that and --no-check-case to skip the case rule as well, and --check-separator to also reject underscores.
  entry: check-spec-name
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-version
  name: check-spec-version
  description: Ensure the spec Version field follows the version rules from the openRuyi packaging guidelines.
  entry: check-spec-version
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-release
  name: check-spec-release
  description: >-
    Ensure the spec Release field follows the release rules from the openRuyi
    packaging guidelines: it must be present and use %autorelease, must not
    hard-code a distribution suffix, and the %{dist} macro must not be
    overridden.
  entry: check-spec-release
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-summary
  name: check-spec-summary
  description: >-
    Ensure the spec Summary field follows the summary rules from the openRuyi
    packaging guidelines: it must be present and non-empty, must not end with
    an English period, and should be English only.
  entry: check-spec-summary
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-license
  name: check-spec-license
  description: >-
    Ensure the spec License field follows the license rules from the openRuyi
    packaging guidelines: the value must be a valid SPDX license expression,
    every identifier must exist in the SPDX license list, and identifiers must
    use the canonical case.
  entry: check-spec-license
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-url
  name: check-spec-url
  description: >-
    Ensure the spec URL field follows the URL rules from the openRuyi
    packaging guidelines: the spec must set URL to the package website or the
    project source URL, or write the placeholder comment; the value must be an
    absolute URL and must not be built from macros; the field must be spelled
    URL. Use --no-check-field-case to skip the spelling rule.
  entry: check-spec-url
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-vcs
  name: check-spec-vcs
  description: >-
    Ensure the spec VCS field follows the VCS rules from the openRuyi packaging
    guidelines: VCS may be omitted only when URL already names the source
    repository, and is required otherwise, either as a cloneable address or as
    the placeholder comment; the value must be a clone URL and must not be
    built from macros; the field must be spelled VCS. Use
    --no-check-field-case to skip the spelling rule and --no-check-doc-site to
    accept a documentation or package-index URL without VCS.
  entry: check-spec-vcs
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-source
  name: check-spec-source
  description: >-
    Ensure the spec Source, SourceN and %sourcelist declarations follow the
    source rules from the openRuyi packaging guidelines: every network source
    needs an adjacent RemoteAsset comment carrying a sha256 checksum, a VCS
    fetch also needs CreateArchive, sources must be numbered from 0 without
    gaps, SourceForge URLs must use downloads.sourceforge.net, the tarball
    name must be derivable from the URL, and the field must be spelled Source
    or SourceN. Use --no-check-field-case to skip the spelling rule and
    --no-check-index-sequence to allow numbering gaps.
  entry: check-spec-source
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-buildarch
  name: check-spec-buildarch
  description: >-
    Ensure the spec BuildArch field follows the build architecture rules from
    the openRuyi packaging guidelines: the field is spelled BuildArch, carries
    one bare lowercase architecture token, is written at most once per field
    block, sits after the last Source, SourceN or %sourcelist declaration and
    before BuildSystem, and does not make a noarch block depend on the build
    architecture. The field is conditional, so a spec without it is never
    reported. Use --no-check-field-case to skip the spelling rule and
    --no-check-noarch to skip the noarch rule.
  entry: check-spec-buildarch
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-buildsystem
  name: check-spec-buildsystem
  description: >-
    Ensure the spec BuildSystem field follows the declarative build system
    rules from the openRuyi packaging guidelines: the field is spelled
    BuildSystem, carries one literal lowercase build system name rather than
    an empty value or a macro reference, is written at most once per field
    block, sits after the last Source, SourceN or %sourcelist declaration,
    and sits after BuildArch and before BuildRequires. The field is
    conditional, so a spec without it is never reported. Use
    --no-check-field-case to skip the spelling rule, --no-check-value to
    skip the value rules and --no-check-position to skip the position rules.
  entry: check-spec-buildsystem
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
