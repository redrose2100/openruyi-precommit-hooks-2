[metadata]
name = openruyi-precommit-hooks
version = 0.1.0
description = Some out-of-the-box hooks for pre-commit (openruyi edition).
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/openRuyi-Project/openruyi-precommit-hooks
author = redrose2100
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
exclude =
    scripts*
    tests*
    testing*

[options.entry_points]
console_scripts =
    check-spec-header = openruyi_precommit_hooks.check_spec_header:main
    check-spec-basic-fields = openruyi_precommit_hooks.check_spec_basic_fields:main
    check-spec-name = openruyi_precommit_hooks.check_spec_name:main
    check-spec-version = openruyi_precommit_hooks.check_spec_version:main
    check-spec-release = openruyi_precommit_hooks.check_spec_release:main
    check-spec-summary = openruyi_precommit_hooks.check_spec_summary:main
    check-spec-license = openruyi_precommit_hooks.check_spec_license:main
    check-spec-url = openruyi_precommit_hooks.check_spec_url:main
    check-spec-vcs = openruyi_precommit_hooks.check_spec_vcs:main
    check-spec-source = openruyi_precommit_hooks.check_spec_source:main
    check-spec-buildarch = openruyi_precommit_hooks.check_spec_buildarch:main
    check-spec-buildsystem = openruyi_precommit_hooks.check_spec_buildsystem:main
    check-spec-buildoption = openruyi_precommit_hooks.check_spec_buildoption:main
    check-spec-buildrequires = openruyi_precommit_hooks.check_spec_buildrequires:main
    check-spec-requires = openruyi_precommit_hooks.check_spec_requires:main
    check-spec-patch-patchlist = openruyi_precommit_hooks.check_spec_patch_patchlist:main
    check-spec-subpackaging = openruyi_precommit_hooks.check_spec_subpackaging:main
    check-spec-script = openruyi_precommit_hooks.check_spec_script:main
    check-spec-condition-build = openruyi_precommit_hooks.check_spec_condition_build:main
    check-spec-build-autotools = openruyi_precommit_hooks.check_spec_build_autotools:main
    check-spec-build-cmake = openruyi_precommit_hooks.check_spec_build_cmake:main
    check-spec-build-go = openruyi_precommit_hooks.check_spec_build_go:main
    check-spec-build-meson = openruyi_precommit_hooks.check_spec_build_meson:main
    check-spec-build-perl = openruyi_precommit_hooks.check_spec_build_perl:main
    check-spec-build-pyproject = openruyi_precommit_hooks.check_spec_build_pyproject:main
    check-spec-build-rust = openruyi_precommit_hooks.check_spec_build_rust:main
    check-spec-programming-golang = openruyi_precommit_hooks.check_spec_programming_golang:main
    check-spec-programming-perl = openruyi_precommit_hooks.check_spec_programming_perl:main
    check-spec-programming-python = openruyi_precommit_hooks.check_spec_programming_python:main
    check-spec-programming-rust = openruyi_precommit_hooks.check_spec_programming_rust:main

[bdist_wheel]
universal = True

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[mypy-testing.*]
disallow_untyped_defs = false

[mypy-tests.*]
disallow_untyped_defs = false
